[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reader-backend"
version = "0.1.0"
description = "Backend API for the reader PWA"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "PyJWT==2.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "import-linter==2.17",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.ports",
    "app.services",
    "app.adapters",
    "app.api",
    "app.core",
    "app.main",
    "app.composition",
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "pydantic_settings",
    "starlette",
    "httpx",
    "jwt",
    "argon2",
    "alembic",
]

[[tool.importlinter.contracts]]
name = "ports only depend on domain"
type = "forbidden"
source_modules = ["app.ports"]
forbidden_modules = [
    "app.services",
    "app.adapters",
    "app.api",
    "app.core",
    "app.main",
    "app.composition",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "pydantic",
    "pydantic_settings",
    "jwt",
    "argon2",
    "alembic",
]

[[tool.importlinter.contracts]]
name = "services only depend on domain and ports"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = [
    "app.adapters",
    "app.api",
    "app.core",
    "app.main",
    "app.composition",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "pydantic",
    "pydantic_settings",
    "jwt",
    "argon2",
    "alembic",
]

[[tool.importlinter.contracts]]
name = "core does not depend on application layers"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.api", "app.services", "app.adapters", "app.main"]

[[tool.importlinter.contracts]]
name = "adapters do not depend on api or services"
type = "forbidden"
source_modules = ["app.adapters"]
forbidden_modules = [
    "app.api",
    "app.services",
    "app.main",
    "app.composition",
    "fastapi",
    "starlette",
]

# main only assembles the FastAPI app: it reaches adapters/DB solely through composition.
[[tool.importlinter.contracts]]
name = "main only wires api, composition and core"
type = "forbidden"
source_modules = ["app.main"]
forbidden_modules = [
    "app.adapters",
    "app.services",
    "app.ports",
    "app.domain",
    "sqlalchemy",
    "alembic",
    "argon2",
    "jwt",
]
# Direct imports only: app.main -> app.composition -> adapters is the intended path.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "cli only reaches adapters through composition"
type = "forbidden"
source_modules = ["app.cli"]
forbidden_modules = ["app.adapters", "sqlalchemy"]
# Direct imports only: app.cli -> app.composition -> adapters is the intended path.
allow_indirect_imports = true

# Exception: app.api.deps is the single composition point allowed to import adapters.
[[tool.importlinter.contracts]]
name = "api does not import adapters (except deps) nor sqlalchemy"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = [
    "app.adapters",
    "app.composition",
    "sqlalchemy",
    "jwt",
    "argon2",
    "alembic",
]
# Direct imports only: app.api.deps -> app.composition -> adapters is the intended path.
allow_indirect_imports = true
ignore_imports = [
    "app.api.deps -> app.composition",
]
# Fail when an exception no longer matches any import, so stale exceptions cannot linger.
unmatched_ignore_imports_alerting = "error"