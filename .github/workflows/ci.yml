name: CI

# Runs on pushes to master and on pull requests, and is reused by release.yml (workflow_call).
# Never use `pull_request_target` here: this workflow checks out and runs the PR's own code.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

# Least privilege by default; every job below repeats it on purpose.
permissions:
  contents: read

concurrency:
  # Newer runs cancel older ones for the same ref (never cancel a run that is part of a release tag).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            infra/constraints.txt
      - name: Install (pinned like the Docker image)
        working-directory: ${{ github.workspace }}
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/infra/constraints.txt
        run: pip install -e "backend[dev]"
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format --check
        run: python -m ruff format --check .
      - name: mypy
        run: python -m mypy
      - name: lint-imports (architecture)
        run: lint-imports
      - name: pytest
        run: python -m pytest -q
      - name: bandit
        run: python -m bandit -q -r app
      - name: pip-audit
        run: python -m pip_audit

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same exact version as the Dockerfile (node:24.21.0-slim). Change both together.
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: arch
        run: npm run arch
      - name: format:check
        run: npm run format:check
      - name: build
        run: npm run build
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev

  infra-tests:
    name: infra tests (deploy hook and release notes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: deploy-hook receiver
        run: python -I -m unittest discover -s infra/deploy-hook -p "test_*.py"
      - name: release notes script
        run: python -I -m unittest discover -s .github/scripts -p "test_*.py"

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history is scanned too (the repository is public)
          persist-credentials: false
      - name: Install gitleaks (pinned version, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the official gitleaks_8.30.1_checksums.txt
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
      - name: Scan the working tree
        run: gitleaks detect --no-git --source . --redact --config scripts/gitleaks.toml
      - name: Scan the git history
        run: gitleaks detect --source . --redact --config scripts/gitleaks.toml

  docker-build:
    name: docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (proves the Dockerfile builds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          push: false
          load: false
          build-args: |
            APP_VERSION=ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image,ignore-error=true
