name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-prerelease) tests the code, publishes the image to GHCR and
# creates the GitHub Release. Any failing job stops everything after it.
#   prepare -> verify (same checks as ci.yml) -> publish (GHCR) -> release (GitHub Release)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: validate tag and notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.notes.outputs.tag }}
      version: ${{ steps.notes.outputs.version }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate the tag and require its CHANGELOG section
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: python -I .github/scripts/release_notes.py "$TAG" --notes-out "$RUNNER_TEMP/notes.md" --github-output "$GITHUB_OUTPUT"
      - name: Require the tagged commit to be on master
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SHA" origin/master || {
            echo "The tagged commit is not on master; refusing to publish." >&2
            exit 1
          }
      - name: Derive the lowercase image name (GHCR requires lowercase)
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  verify:
    name: verify (full CI)
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: publish image to GHCR
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The only job that can write packages or sign attestations.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # To also publish linux/arm64: add a docker/setup-qemu-action step (pinned by SHA) before
      # buildx and set `platforms: linux/amd64,linux/arm64` below. The build gets much slower.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build timestamp
        id: ts
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: true
          # vX.Y.Z and X.Y.Z always; latest only for final releases (no "-" in the tag).
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.prerelease == 'false' && format('{0}:latest', needs.prepare.outputs.image) || '' }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.ts.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image,ignore-error=true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: create GitHub Release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write repository contents (creates the Release).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Create the release with the CHANGELOG notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python -I .github/scripts/release_notes.py "$TAG" --notes-out "$RUNNER_TEMP/notes.md"
          flags=(--verify-tag)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
