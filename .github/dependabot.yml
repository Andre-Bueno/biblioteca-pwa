version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    # Security updates stay as separate PRs; routine ones are grouped. Keep infra/constraints.txt in
    # sync by hand (it is generated inside python:3.12.8-slim, see infra/gen_constraints.sh).
    groups:
      python-dev-tools:
        dependency-type: development
      python-runtime:
        dependency-type: production
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development
      npm-runtime:
        dependency-type: production
    commit-message:
      prefix: "chore(deps)"
    # eslint 10 breaks eslint-plugin-react (peer range stops at ^9.7); revisit when the plugin supports it.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
    # The Dockerfile is pinned to Node 24 (LTS) by tests/integration/test_docker_files.py; skip newer majors.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(docker)"
